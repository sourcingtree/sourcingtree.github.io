<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>알림센터 · 기기 연결</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --text:#16181d; --text2:#4a5058; --text3:#868d97;
    --line:#e6e8ec; --primary:#2f6bff; --primaryText:#fff;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#101216; --card:#181b21; --text:#f2f4f7; --text2:#b6bcc6; --text3:#7f8792;
           --line:#262a32; --primary:#5b8cff; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
                   "Malgun Gothic",system-ui,sans-serif;
       -webkit-font-smoothing:antialiased;line-height:1.6}
  .wrap{max-width:420px;margin:0 auto;padding:32px 20px 48px}
  .brand{font-size:13px;color:var(--text3);letter-spacing:.02em;margin-bottom:6px}
  h1{font-size:22px;line-height:1.42;margin:0 0 10px;letter-spacing:-.01em}
  .lede{font-size:14.5px;color:var(--text2);margin:0 0 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:18px 18px 20px;margin-bottom:14px}
  .code-label{font-size:12.5px;color:var(--text3);margin-bottom:6px}
  .code{font-size:30px;font-weight:700;letter-spacing:.22em;
        font-variant-numeric:tabular-nums;margin:0}
  .expire{font-size:12px;color:var(--text3);margin-top:8px}
  .btn{display:block;width:100%;padding:15px 16px;border-radius:13px;border:0;
       background:var(--primary);color:var(--primaryText);font-size:15.5px;font-weight:600;
       text-align:center;text-decoration:none;margin-bottom:9px;cursor:pointer;
       font-family:inherit}
  .btn.sub{background:transparent;color:var(--text2);border:1px solid var(--line);font-weight:500}
  ol{margin:0;padding-left:18px}
  ol li{font-size:13.5px;color:var(--text2);margin-bottom:9px}
  ol li:last-child{margin-bottom:0}
  .h{font-size:13px;font-weight:600;color:var(--text);margin:0 0 12px}
  .foot{font-size:12px;color:var(--text3);text-align:center;margin-top:26px;line-height:1.7}
  .foot a{color:var(--text3)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">알림센터</div>
  <h1 id="head">서브폰 알림을 이 기기로 받습니다</h1>
  <p class="lede" id="lede">앱을 설치하면 이어서 연결됩니다.</p>

  <div class="card" id="codeCard" hidden>
    <div class="code-label">연결 코드</div>
    <p class="code" id="code"></p>
    <div class="expire">보안을 위해 5분 뒤 사라집니다. 만료되면 보내는 폰에서 새로 만드세요.</div>
  </div>

  <a class="btn" id="store" href="#">앱 설치하기</a>
  <a class="btn sub" id="open" href="#" hidden>앱에서 열기</a>

  <div class="card" style="margin-top:14px">
    <p class="h">연결하는 법</p>
    <ol>
      <li>이 기기에 알림센터를 설치합니다.</li>
      <li>앱을 열고 <b>수신</b> 탭의 <b>QR 촬영하기</b>를 누릅니다.</li>
      <li>보내는 폰의 QR을 비추거나 위 코드 6자리를 입력합니다.</li>
    </ol>
  </div>

  <p class="foot">
    알림 내용은 서버에 저장되지 않습니다. 전달 중에만 지나갑니다.<br>
    <a href="/legal/ko/privacy.html">개인정보 처리방침</a>
  </p>
</div>

<script>
(function () {
  var IOS_URL = "https://apps.apple.com/app/id6806892283";
  var PLAY_URL = "https://play.google.com/store/apps/details?id=com.remain.notibinder";

  var q = new URLSearchParams(location.search);
  var id = q.get("id") || "";
  var code = (q.get("code") || "").toUpperCase();

  // 코드는 있을 때만 보여 준다. 이 페이지는 그냥 열릴 수도 있다
  if (/^[A-Z0-9]{6}$/.test(code)) {
    document.getElementById("code").textContent = code.slice(0, 3) + " " + code.slice(3);
    document.getElementById("codeCard").hidden = false;
  } else {
    document.getElementById("lede").textContent =
      "보내는 폰에서 QR을 띄운 뒤 이 기기로 찍어 주세요.";
  }

  // 어느 스토어로 보낼지는 기기가 정한다.
  // iPadOS 는 데스크톱 사파리로 위장하므로 터치 지원 여부까지 본다.
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
              (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);

  var store = document.getElementById("store");
  if (isIOS) {
    store.href = IOS_URL;
    store.textContent = "App Store에서 설치";
  } else if (isAndroid) {
    store.href = PLAY_URL;
    store.textContent = "Play 스토어에서 설치";
  } else {
    // PC 로 열린 경우 — 스토어로 보내 봐야 설치가 안 된다
    store.href = IOS_URL;
    store.textContent = "App Store에서 보기";
    document.getElementById("lede").textContent =
      "알림을 받을 휴대폰에서 열어 주세요. 이 페이지는 폰에서 여는 화면입니다.";
  }

  // 앱이 이미 있으면 바로 넘어갈 수 있게 한 줄 더 둔다.
  // 스킴이 등록돼 있지 않으면 아무 일도 없으므로 눈에 띄지 않게 보조 버튼으로만.
  if (id && code) {
    var open = document.getElementById("open");
    open.href = "notibinder://pair?id=" + encodeURIComponent(id) + "&code=" + encodeURIComponent(code);
    open.hidden = false;
  }
})();
</script>
</body>
</html>
